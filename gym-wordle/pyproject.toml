[project]
name = "gym-wordle"
version = "2.0.0"
description = "Wordle as a gymnasium environment, with DQN agents"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gym_wordle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
